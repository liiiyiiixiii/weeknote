name: Bug 报告
description: 提交一个可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除密钥、域名、IP、Cookie、数据库内容和真实业务数据。
  - type: input
    id: version
    attributes:
      label: Weeknote 版本
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行方式
      options:
        - 本地开发服务器
        - Nginx + systemd
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的步骤和已脱敏输入。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我确认内容中没有密钥、Cookie、真实服务器信息或业务数据。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
