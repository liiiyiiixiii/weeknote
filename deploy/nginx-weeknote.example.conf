# Public deployment example for weeknote.
# Replace example.com and the TLS certificate paths before enabling this file.

limit_req_zone $binary_remote_addr zone=ask_req_per_ip:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ask_ws_req_per_ip:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=ask_conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 308 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    server_tokens off;
    client_max_body_size 17m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' wss:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /ask {
        return 308 /ask/;
    }

    location = /ask/ws/asr {
        limit_req zone=ask_ws_req_per_ip burst=2 nodelay;
        limit_req_status 429;
        limit_conn ask_conn_per_ip 2;
        rewrite ^/ask/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /ask;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 30s;
    }

    location ^~ /ask/ {
        limit_req zone=ask_req_per_ip burst=20 nodelay;
        limit_req_status 429;
        limit_conn ask_conn_per_ip 4;
        rewrite ^/ask/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /ask;
        proxy_connect_timeout 5s;
        proxy_read_timeout 270s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
